# WildLens frontend (nginx): the Vite build with SPA fallback, /api proxied to the backend
# service, and the local ONNX models (read-only bind mount at /srv/models) for browser mode.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Uploads: backend limit is 10 MB (WILDLENS_MAX_UPLOAD_MB) plus multipart overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/manifest+json application/wasm;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API (and its docs) on the backend service. Unbuffered so chat answers stream (SSE).
    # ^~ so the image-extension rule below never catches /api/figures/*.png etc.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Browser-inference mode: GET /models/<name>.onnx from the mounted models/ directory only.
    location ^~ /models/ {
        location ~ ^/models/[A-Za-z0-9._-]+\.onnx$ {
            root /srv;
            limit_except GET { deny all; }
            default_type application/octet-stream;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        return 404;
    }

    # Content-hashed build output: cache for a year.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed static files (samples, hero photo, icons): revalidate daily.
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html (the router shows its 404 page);
    # index.html itself is always revalidated so a rebuild is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
